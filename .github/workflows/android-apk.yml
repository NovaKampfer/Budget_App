name: Android APK

# Builds the Android app into an installable APK on GitHub's servers.
# Download it from the run's "Artifacts" section (EasyBudget-apk).

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
  # Weekly: touch the cached signing key so GitHub doesn't delete it
  # (unused caches are removed after 7 days). See "keep-key" below.
  schedule:
    - cron: "41 7 * * 1"

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  # Name of the cache entry holding the app's signing key. Builds on the main
  # branch save it; builds on every branch can read main's cache entries.
  SIGNING_CACHE_KEY: easybudget-signing-key-v2

jobs:
  tests:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run data layer tests
        working-directory: android
        run: python -m unittest discover -s tests -v

  apk:
    name: Build APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      # Pinned: Buildozer / python-for-android are tested up to Python 3.14.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      # Android SDK / NDK downloads (~3 GB) are reused between runs.
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-sdk-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Signing. Android only installs an update over the app on your phone
      # when both APKs are signed with the SAME key (otherwise you'd have to
      # uninstall, losing your data). So every build signs with one key:
      #   1. the DEBUG_KEYSTORE_BASE64 secret, if set (permanent - see
      #      android/README.md), otherwise
      #   2. the key saved in this repository's Actions cache by main builds.
      # ------------------------------------------------------------------
      - name: Restore signing key
        id: key_cache
        if: env.HAS_KEYSTORE_SECRET != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/easybudget-signing
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          ks="$HOME/easybudget-signing/easybudget.keystore"
          mkdir -p "$(dirname "$ks")"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$ks"
            source="the DEBUG_KEYSTORE_BASE64 secret"
          elif [ -f "$ks" ]; then
            source="the saved key (Actions cache)"
          else
            keytool -genkeypair -noprompt -keystore "$ks" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=EasyBudget,O=EasyBudget,C=US"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              source="a NEW key (saved now for all future builds)"
            else
              source="a TEMPORARY key (no key saved by a main build yet)"
              echo "::warning::This APK is signed with a temporary key and won't install over other builds. Use the APK from a build of the main branch."
            fi
          fi
          fp=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey \
               | grep -m1 "SHA256:" | awk '{print $2}')
          if [ -z "$fp" ]; then
            echo "::error::Could not read the signing key"; exit 1
          fi
          {
            echo "P4A_RELEASE_KEYSTORE=$ks"
            echo "P4A_RELEASE_KEYSTORE_PASSWD=android"
            echo "P4A_RELEASE_KEYALIAS=androiddebugkey"
            echo "P4A_RELEASE_KEYALIAS_PASSWD=android"
          } >> "$GITHUB_ENV"
          echo "Signing with $source"
          echo "Signing key SHA-256: $fp"
          {
            echo "**Signed with:** $source  "
            echo "**Signing key (SHA-256):** \`$fp\`  "
            echo "APKs install over each other only when this fingerprint matches."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        working-directory: android
        run: buildozer android release

      - name: Save signing key (main branch, first time only)
        if: >-
          env.HAS_KEYSTORE_SECRET != 'true' && github.ref == 'refs/heads/main'
          && steps.key_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/easybudget-signing
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: EasyBudget-apk
          path: android/bin/*.apk
          if-no-files-found: error

  keep-key:
    name: Keep signing key cached
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch the cached signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/easybudget-signing
          key: ${{ env.SIGNING_CACHE_KEY }}
